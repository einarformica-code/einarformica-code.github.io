<main>
   <form action="https://www.w3schools.com/action_page.php" method="get">
    <fieldset>
      <legend>Datos Personales</legend>
      <label for = "nombre">Nombre:</label>
      <!--Etiquetapara nombre-->
        <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellidos"  ><br><br>
        <!-- Campo de input para nombre-->
        <label for="email">Correo Electrónico:</label>
         <!--Etique tapara correo-->
        <input type="email" id="email" name="email"  placeholder="email" required><br><br>
        <!--Campo de input para correo-->   
     </fieldset><!--Fin del fieldset-->

     <fieldset>
        <legend>Tipo de Entrada</legend>
        <label for ="Abono General (3 Días)">Abono General (3 Días)</label>
        <!--Etiqueta abono VIP-->
        <input type="radio" id="Abono General (3 Días)" name="entrada" value="Abono General (3 Días)" ><br><br>
        <!-- Campo de input para entrada general-->

         <label for ="Abono VIP (3 Días)">Abono VIP (3 Días)</label>
        <!--Etiqueta abono VIP-->
        <input type="radio" id="Abono VIP (3 Días)" name="entrada" value="Abono VIP (3 Días)">
        <!--Campo input abono VIP-->
        <br><br>

        <label for ="Entrada de Día">Entrada de Día</label>
        <!--Etiqueta entrada de día-->
        <input type="radio" id="Entrada de Día" name="entrada" value="Entrada de Día">
        <!--Campo input abono VIP-->
     </fieldset><!--Cierre tipo de entrada-->

     <fieldset><!--Apertura extras-->
     <legend>Extras</legend>
     <label for = "Camping">Camping</label>
     <input type="checkbox" id="Camping" name="extras" value="Camping"><br><br>

     <label for ="Pack Merchandising">Pack Merchandising</label>
       <input type="checkbox" id="Pack Merchandising" name="extras" value="Pack Merchandising"><br><br>

       <label for ="Acceso a Talleres Tech">Acceso a Talleres Tech</label>
       <input type="checkbox" id="Acceso a Talleres Tech" name="extras" value="Acceso a Talleres Tech"><br><br>
     
       
      </fieldset> <!--Cierre extras-->
      <fieldset>
         <legend>Día (Solo si es Entrada de Día)</legend>
         <select value ="0">
            <option>Viernes</option>
            <option>Sábado</option>
            <option>Domingo</option>   
         </select>


      </fieldset>

   <button type="submit"> Enviar</button>

   </form>
